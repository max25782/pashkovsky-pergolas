openapi: 3.0.0
info:
  title: CRM Gallery Data API
  version: 1.0.0
  description: API для получения данных о галерее и проектах из CRM
paths:
  /api/ai-director/data/gallery:
    description: Endpoint для получения данных о галерее и проектах из CRM
    get:
      summary: Получить данные галереи и проектов
      description: Возвращает категории галереи, изображения и завершенные проекты
      operationId: getGallery
      parameters:
        - name: company_id
          in: query
          required: true
          schema:
            type: string
          description: ID компании (берётся из session attributes)
          x-amazon-bedrock-session-attribute: company_id
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по категории галереи
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
          description: Максимальное количество записей
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Смещение для пагинации
      security:
        - ApiTokenAuth: []
      responses:
        '200':
          description: Данные галереи и проектов
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                  images:
                    type: array
                    items:
                      type: object
                  projects:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
components:
  securitySchemes:
    ApiTokenAuth:
      type: apiKey
      in: header
      name: x-api-token
      x-amazon-bedrock-session-attribute: api_token

