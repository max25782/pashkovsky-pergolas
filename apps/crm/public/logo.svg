  <!-- Text: AluminCRM -->
  <text x="60" y="40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="26" fill="#1E293B">
    Alumin<tspan fill="#2563EB">CRM</tspan>
